# Config for encrypted live interop (tests/live/run.sh).
# encryption = "desired" so the server advertises and accepts encryption.
listen_addr = "127.0.0.1"
port = 4450
min_dialect = "smb21"
max_dialect = "smb311"
signing = "desired"
encryption = "desired"
guest_access = true
health_port = 18080
max_credits = 1024

[shares.public]
name = "public"
comment = "Pub"
path = "/tmp/rssmb-live/public"
guest_ok = true

[shares.private]
name = "private"
comment = "Priv"
path = "/tmp/rssmb-live/private"
guest_ok = false
valid_users = ["alice"]

[[users]]
username = "alice"
password = "TestPass123"