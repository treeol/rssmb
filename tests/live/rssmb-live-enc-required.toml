# Config for encryption-required live interop.
listen_addr = "127.0.0.1"
port = 4450
min_dialect = "smb30"
max_dialect = "smb311"
signing = "desired"
encryption = "required"
guest_access = true
health_port = 18080
max_credits = 8192

[shares.public]
name = "public"
path = "/tmp/rssmb-live/public"
guest_ok = true

[shares.private]
name = "private"
path = "/tmp/rssmb-live/private"
guest_ok = false
valid_users = ["alice"]

[[users]]
username = "alice"
password = "TestPass123"