# Config for encrypted kernel CIFS mount (tests/live/mount.sh).
# encryption = "desired" so the server offers AES-128-GCM for 3.1.1.
# Binds 0.0.0.0 so the docker container can reach the host.
listen_addr = "0.0.0.0"
port = 4450
min_dialect = "smb21"
max_dialect = "smb311"
signing = "desired"
encryption = "desired"
guest_access = true
health_port = 18081
max_credits = 8192

[shares.public]
name = "public"
path = "/tmp/rssmb-live/public"
guest_ok = true

[shares.private]
name = "private"
path = "/tmp/rssmb-live/private"
guest_ok = false
valid_users = ["alice"]

[[users]]
username = "alice"
password = "TestPass123"