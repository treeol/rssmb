name: Interop CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Nightly at 03:00 UTC — for smbtorture baseline and full interop.
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Job 1: Unit + integration tests (always, fast).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -Dclippy::all
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test --workspace

  # Job 2: impacket interop (always on push/PR, nightly too).
  impacket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build server
        run: cargo build --bin rssmb
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install impacket
        run: pip install impacket
      - name: Run impacket interop
        run: |
          PY=$(which python) tests/live/run.sh

  # Job 3: smbclient interop (always on push/PR, nightly too).
  smbclient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build server
        run: cargo build --bin rssmb
      - name: Install smbclient
        run: sudo apt-get update && sudo apt-get install -y smbclient
      - name: Start server
        run: |
          rm -rf /tmp/rssmb-live && mkdir -p /tmp/rssmb-live/public /tmp/rssmb-live/private
          echo "hello from rssmb" > /tmp/rssmb-live/public/README.txt
          echo "secret" > /tmp/rssmb-live/private/s.txt
          ./target/debug/rssmb --config tests/live/rssmb-live-encrypted.toml &
          echo $! > /tmp/rssmb.pid
          sleep 1
      - name: Run smbclient interop
        run: tests/live/smbclient.sh
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/rssmb.pid)" 2>/dev/null || true

  # Job 3b: rclone (go-smb2) interop (always on push/PR, nightly too).
  # go-smb2 is a strict SPNEGO initiator; it must gate PRs because every
  # other PR-gating client tolerates RFC 4178 deviations.
  rclone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build server
        run: cargo build --bin rssmb
      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash
      - name: Start server
        run: |
          rm -rf /tmp/rssmb-live && mkdir -p /tmp/rssmb-live/public /tmp/rssmb-live/private
          echo "hello from rssmb" > /tmp/rssmb-live/public/README.txt
          echo "secret" > /tmp/rssmb-live/private/s.txt
          ./target/debug/rssmb --config tests/live/rssmb-live-encrypted.toml &
          echo $! > /tmp/rssmb.pid
          sleep 1
      - name: Run rclone interop
        run: tests/live/rclone.sh
      - name: Stop server
        if: always()
        run: kill "$(cat /tmp/rssmb.pid)" 2>/dev/null || true

  # Job 4: smbtorture baseline (nightly only — too slow for PR gating).
  # Known subtest failures are expected here (see results.md), so the job
  # is continue-on-error: the run reports success with a neutral-annotated
  # baseline step. Per-suite budgets live in run-smbtorture.sh (smb2.lease
  # 300 s, smb2.notify 240 s, others 120 s); a suite that overruns its
  # budget is reported INCOMPLETE with no pass count — never a silently
  # truncated count. Note: with continue-on-error the job itself can no
  # longer fail the run; real harness breakage is still visible as a
  # skipped "Review baseline results" step plus the neutral annotation.
  smbtorture:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # The baseline documents ~170 known-failing subtests (lease campaign
    # ongoing, lock = Campaign C, app-instance not-implemented), so any
    # suite failure is expected debt, not a regression signal: never let
    # the nightly run go red on it. Real regressions are still visible as
    # new failing subtests in the uploaded smbtorture-baseline artifact
    # (results.md) and in the step's per-suite console table.
    continue-on-error: true
    # Sum of per-suite budgets (~36 min worst case) plus build time.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build server
        run: cargo build --bin rssmb
      - name: Install smbtorture
        run: |
          sudo apt-get update
          sudo apt-get install -y samba-testsuite cifs-utils
      - name: Run smbtorture baseline
        id: baseline
        continue-on-error: true
        run: tests/conformance/run-smbtorture.sh
      # Surface the baseline table and per-suite logs (incl. any
      # INCOMPLETE rows) as artifacts for inspection.
      - name: Collect baseline artifacts
        if: always()
        run: |
          mkdir -p smbtorture-artifacts
          cp tests/conformance/results.md smbtorture-artifacts/ 2>/dev/null || true
          cp /tmp/torture-*.log smbtorture-artifacts/ 2>/dev/null || true
      - name: Upload baseline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smbtorture-baseline
          path: smbtorture-artifacts/
          if-no-files-found: warn
      # Success/neutral is the healthy nightly signal ("Baseline collected"
      # = some suites still fail known debt; neutral = script bug). SKIPPED
      # means the baseline step never ran — build or install broke; check
      # that job. If the job ever reports failure, a hard error escaped
      # continue-on-error (e.g. job-level timeout) and deserves attention.
      - name: Review baseline results
        if: always() && !cancelled()
        run: |
          case "${{ steps.baseline.outcome }}" in
            success|neutral)
              echo "Baseline collected. Known failures are documented debt — compare results.md against the previous night for regressions."
              ;;
            skipped)
              echo "::error::baseline step did NOT run (build/install failed or workflow changed) — inspect the smbtorture job"
              exit 1
              ;;
            *)
              echo "::warning::baseline runner exited abnormally (outcome: ${{ steps.baseline.outcome }}) — inspect logs/artifacts"
              ;;
          esac

  # Job 5: Fuzz targets build check (always — catches compile regressions).
  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust (nightly for cargo-fuzz)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build fuzz targets
        env:
          RUSTFLAGS: ""
        run: |
          cd fuzz
          # +nightly is required: the root rust-toolchain.toml pins stable,
          # and rustup applies it inside fuzz/ too (-Zsanitizer needs nightly).
          # Explicit gnu target: the prebuilt (musl) cargo-fuzz would
          # otherwise default to musl, which ASan does not support.
          cargo +nightly fuzz build --target x86_64-unknown-linux-gnu

  # Job 6: Fuzz targets (nightly only — short runs per target).
  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust (nightly for cargo-fuzz)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Run fuzz targets (5 min each)
        env:
          RUSTFLAGS: ""
        run: |
          cd fuzz
          rc=0
          for target in parse_payload read_netbios_frame extract_ntlm_token extract_mech_types proto_decode_header proto_decode_plain_request normalize_path ntlm_authenticate decrypt_transform; do
            echo "=== Fuzzing $target (5 min) ==="
            # Use libFuzzer's own -max_total_time for the campaign budget.
            # Exit 0 = clean, 77 = no crash found (expected for short runs).
            # Any other exit = crash or build failure.
            cargo +nightly fuzz run --target x86_64-unknown-linux-gnu "$target" -- -max_len=65536 -timeout=5 -max_total_time=300
            exit_code=$?
            if [ $exit_code -ne 0 ] && [ $exit_code -ne 77 ]; then
              echo "FAIL: $target crashed or failed to build (exit $exit_code)"
              rc=1
            fi
          done
          exit $rc