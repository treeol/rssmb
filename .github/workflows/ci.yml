name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -Dclippy::all
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --workspace --locked

  # Supply-chain checks — cargo-deny (advisories, licenses, bans, sources)
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run cargo-deny
        run: cargo deny check

  # Security advisories — cargo-audit (RustSec advisory database)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo-audit
        # Ignore transitive advisories already documented in deny.toml:
        # - RUSTSEC-2023-0071: rsa via sspi -> picky (RSSMB uses NTLMv2 only; RSA never reached)
        # - RUSTSEC-2025-0134: rustls-pemfile unmaintained warning
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0134