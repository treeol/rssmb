name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        # await_holding_lock: no std::sync guard may be alive across an
        # .await — see docs/lock-audit.md §3 (gate added there, verified 0 fires).
        run: cargo clippy --all-targets -- -Dclippy::all -Dclippy::await_holding_lock
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --workspace --locked

  # MSRV check — cargo check on the declared minimum supported toolchain.
  # The stable job above proves the workspace builds on current stable;
  # this job proves it still builds on rust-version (1.93, driven by
  # sspi 0.23). check only (no clippy/test): MSRV gates compilation,
  # not lints or runtime behavior.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust (MSRV)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo check on MSRV
        run: cargo check --workspace --locked

  # Supply-chain checks — cargo-deny (advisories, licenses, bans, sources)
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Run cargo-deny
        run: cargo deny check

  # Security advisories — cargo-audit (RustSec advisory database)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Run cargo-audit
        # Ignore transitive advisories already documented in deny.toml:
        # - RUSTSEC-2023-0071: rsa via sspi -> picky (RSSMB uses NTLMv2 only; RSA never reached)
        # - RUSTSEC-2025-0134: rustls-pemfile unmaintained warning
        # - RUSTSEC-2026-0387: crypto-bigint 0.7.5 timing variability (transitive via aws-lc-sys; constant-time ops unused)
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2026-0387