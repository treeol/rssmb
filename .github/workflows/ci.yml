name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@148e52333fd6d1d9a9cbf3a0e1f2bc2b5f8f8e1e # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@f0deed1e0fedfc375a7d1c5f3ff8825f1c88e3e3 # v2.7.8
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -Dclippy::all
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --workspace --locked

  # Supply-chain checks — cargo-deny (advisories, licenses, bans, sources)
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-deny
        run: |
          mkdir -p ~/.cargo/bin
          curl -sL https://github.com/EmbarkStudios/cargo-deny/releases/latest/download/cargo-deny-0.16.5-x86_64-unknown-linux-musl.tar.gz \
            | tar xz -C ~/.cargo/bin --strip-components=1
          chmod +x ~/.cargo/bin/cargo-deny
      - name: Run cargo-deny
        run: cargo deny check

  # Security advisories — cargo-audit (RustSec advisory database)
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install cargo-audit
        run: |
          mkdir -p ~/.cargo/bin
          curl -sL https://github.com/RustSec/cargo-audit/releases/latest/download/cargo-audit-0.21.2-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C ~/.cargo/bin --strip-components=1
          chmod +x ~/.cargo/bin/cargo-audit
      - name: Run cargo-audit
        run: cargo audit