[package]
name = "rssmb-cli"
description = "RSSMB server binary: config, CLI args, signal handling, health endpoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "rssmb"
path = "src/main.rs"

[features]
# Global allocator override: on by default for the release/shipped binary.
# musl's system malloc is markedly slower than glibc's for the server's
# per-read allocation pattern (R-07a A/B: main musl 424 vs main glibc
# 1501 MiB/s unsealed fio r16); mimalloc closes most of that gap.
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]

[dependencies]
rssmb-server = { workspace = true }
rssmb-auth = { workspace = true }
rssmb-vfs = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
hex = "0.4"
mimalloc = { version = "0.1", optional = true, default-features = false, features = ["local_dynamic_tls"] }
