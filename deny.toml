# cargo-deny configuration
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# Abort build on any advisory in the RustSec database
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # rsa (Marvin timing side-channel) — pulled in transitively via sspi -> picky.
    # RSSMB authenticates with NTLMv2 only and never performs RSA private-key
    # operations, so the vulnerable code path is unreachable. No fix upstream.
    { id = "RUSTSEC-2023-0071", reason = "transitive via sspi/picky; RSA private-key ops unused (NTLMv2 only); no upstream fix" },
    # rustls-pemfile unmaintained — informational; used only to load the QUIC
    # cert/key PEM files at startup. Migrate to rustls-pki-types PEM parsing.
    { id = "RUSTSEC-2025-0134", reason = "unmaintained notice only; startup-time PEM loading; migration pending" },
    # crypto-bigint 0.7.5 timing variability — transitive via aws-lc-sys
    # (picky/QUIC). The vulnerable constant-time operations are in the
    # modular arithmetic path; rssmb does not use crypto-bigint directly
    # and does not perform private-key operations that depend on
    # constant-time guarantees from this crate. No fixed version available.
    { id = "RUSTSEC-2026-0387", reason = "transitive via aws-lc-sys/crypto-bigint; constant-time ops unused; no upstream fix" },
]

[licenses]
version = 2
# Allow these licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
# Deny anything not in the allow list
confidence-threshold = 0.93

[bans]
# Warn about multiple versions of the same crate
multiple-versions = "warn"
# Deny wildcard dependencies
wildcards = "deny"
# Allow specific duplicate crates (transitive deps we can't control)
allow = []

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []